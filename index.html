<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro PC</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ESCENA PRINCIPAL -->
  <div id="scene-desktop">
    <img id="desk" src="Wallpaper.png" alt="Escritorio retro">

    <!-- BOTÓN POWER -->
    <button id="power-button"></button>
    <div id="led-light" class="led-red-blink"></div>

    <!-- MONITOR -->
    <div id="monitor-screen">
      <div id="monitor-content">

        <!-- WALLPAPER -->
        <div id="monitor-wallpaper" class="hidden"></div>

        <!-- CRT OVERLAY -->
        <div id="crt-overlay"></div>

        <!-- EFECTO APAGADO -->
        <div id="crt-shutdown" class="hidden"></div>

        <!-- ICONOS DEL ESCRITORIO -->
        <div id="desktop-icons">
          <div class="icon" id="icon-folder">
            <img src="folder.png" alt="Carpeta Documentos">
            <span>Documentos</span>
          </div>
          <div class="icon" id="icon-game">
            <img src="api.png" alt="Api">
            <span>Api.exe</span>
          </div>
          <div class="icon" id="icon-info">
            <img src="info.png" alt="Info.txt">
            <span>Info.txt</span>
          </div>
        </div>

        <!-- BARRA DE TAREAS -->
        <div id="taskbar">
          <div class="start-button">
            <img src="start-95.png" alt="Start">
            </div>
          <div class="taskbar-clock">12:00</div>
        </div>


        <!-- VENTANA DOCUMENTOS -->
        <div id="window-documents" class="window hidden">
          <div class="window-header">
            <span class="window-title">Documentos</span>
            <button class="window-close">X</button>
          </div>
          <div class="window-content">
            <div class="icon-doc">
              <img src="doc.png" alt="Documento">
              <span>notas.doc</span>
            </div>
            <div class="icon-doc">
              <img src="doc.png" alt="Documento">
              <span>apuntes.doc</span>
            </div>
          </div>
        </div>

      </div>

      <!-- FLASH -->
      <div id="monitor-flash"></div>
    </div>
  </div>

  <!-- SONIDOS -->
  <audio id="sound-power" src="power-on.mp3" preload="auto"></audio>
  <audio id="sound-poweroff" src="power-off.mp3" preload="auto"></audio>
  <audio id="sound-ambient" src="ambient-radio.mp3" loop preload="auto"></audio>
  <audio id="sound-click" src="click.wav" preload="auto"></audio>
  <audio id="sound-window" src="window-open.wav" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
